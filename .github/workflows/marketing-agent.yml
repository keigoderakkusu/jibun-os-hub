name: Marketing Agent - Daily SNS Posts

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  daily-sns-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate SNS posts with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINE_NOTIFY_TOKEN: ${{ secrets.LINE_NOTIFY_TOKEN }}
        run: node scripts/marketing-agent.js
