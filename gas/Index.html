<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>営業ナレッジ</title>
<style>
/* ── Reset & Base ── */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Sans','Meiryo',sans-serif;background:#fff;color:#37352f;height:100vh;display:flex;flex-direction:column;overflow:hidden}
button,input,textarea{font-family:inherit}

/* ── Top Bar ── */
#topbar{
  display:flex;align-items:center;gap:6px;
  padding:0 12px;height:46px;flex-shrink:0;
  border-bottom:1px solid #e9e9e7;background:#fff;
  position:relative;z-index:10;
}
#topbar-logo{font-size:17px;font-weight:700;margin-right:8px}
.nav-btn{
  padding:5px 11px;border:none;border-radius:6px;cursor:pointer;
  font-size:13px;background:none;color:#787774;white-space:nowrap;
}
.nav-btn:hover{background:#e9e9e7;color:#37352f}
.nav-btn.active{background:#e9e9e7;color:#37352f;font-weight:600}
.spacer{flex:1}
#db-link{font-size:11px;color:#9b9a97;text-decoration:none;padding:4px 8px;border-radius:4px}
#db-link:hover{background:#f0f0ef}

/* ── Pages Container ── */
#pages{flex:1;position:relative;overflow:hidden}
.page{position:absolute;inset:0;display:none;overflow-y:auto}
.page.active{display:flex}

/* ── Memo Layout (split) ── */
#page-memo{flex-direction:row}
#memo-list-col{
  width:210px;flex-shrink:0;border-right:1px solid #e9e9e7;
  background:#fbfbfa;display:flex;flex-direction:column;overflow:hidden;
}
#memo-list-header{padding:10px 8px 6px;flex-shrink:0}
#memo-list-scroll{flex:1;overflow-y:auto;padding:0 4px 8px}
#memo-editor-col{flex:1;overflow-y:auto;padding:36px 48px 60px}

/* ── Memo Items ── */
.memo-item{
  padding:7px 8px;border-radius:6px;cursor:pointer;margin-bottom:1px;
}
.memo-item:hover{background:#ebebea}
.memo-item.active{background:#e9e9e7}
.mi-title{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.mi-date{font-size:11px;color:#9b9a97;margin-top:1px}

/* ── Editor ── */
#save-status{font-size:12px;color:#9b9a97;margin-bottom:10px;min-height:16px}
#memo-title-input{
  width:100%;font-size:30px;font-weight:700;border:none;outline:none;
  background:transparent;color:#37352f;margin-bottom:6px;
}
#memo-tags-input{
  width:100%;border:none;outline:none;font-size:13px;color:#9b9a97;
  background:transparent;margin-bottom:14px;
}
#memo-content-input{
  width:100%;min-height:500px;border:none;outline:none;resize:none;
  font-size:15px;line-height:1.85;background:transparent;color:#37352f;
}
.editor-actions{display:flex;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid #e9e9e7}

/* ── Standard Page Layout ── */
.std-page{flex-direction:column;padding:32px 40px;max-width:800px;width:100%;margin:0 auto}
.page-heading{font-size:24px;font-weight:700;margin-bottom:4px}
.page-sub{font-size:14px;color:#787774;margin-bottom:24px}
.section-title{font-size:13px;font-weight:600;color:#787774;text-transform:uppercase;letter-spacing:.5px;margin:20px 0 8px}

/* ── Buttons ── */
.btn{padding:6px 14px;border-radius:6px;border:none;cursor:pointer;font-size:13px;transition:background .15s}
.btn-primary{background:#2383e2;color:#fff}
.btn-primary:hover{background:#1a6ec7}
.btn-secondary{background:#e9e9e7;color:#37352f}
.btn-secondary:hover{background:#d8d7d2}
.btn-danger{background:#eb5757;color:#fff}
.btn-danger:hover{background:#d44}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-ghost{background:none;border:1px solid #e9e9e7;color:#787774}
.btn-ghost:hover{background:#f0f0ef}
.btn-full{width:100%}

/* ── Inputs ── */
label{display:block;font-size:13px;font-weight:600;color:#37352f;margin:14px 0 5px}
input[type=text],input[type=email],textarea,select{
  width:100%;border:1px solid #e9e9e7;border-radius:7px;
  padding:9px 12px;font-size:14px;background:#fff;outline:none;
  transition:border-color .15s;
}
input[type=text]:focus,input[type=email]:focus,textarea:focus,select:focus{border-color:#2383e2}
textarea{resize:vertical;min-height:110px;line-height:1.7}

/* ── Cards ── */
.card{
  border:1px solid #e9e9e7;border-radius:9px;padding:14px 16px;
  margin-bottom:10px;cursor:pointer;transition:border-color .15s,background .15s;
}
.card:hover{border-color:#2383e2;background:#f4f8ff}
.card.selected{border-color:#2383e2;background:#eef4ff}
.card-title{font-size:14px;font-weight:600;margin-bottom:3px}
.card-sub{font-size:13px;color:#787774}

/* ── OCR Drop Zone ── */
#drop-zone{
  border:2px dashed #d3d1cb;border-radius:12px;padding:44px;
  text-align:center;cursor:pointer;transition:.2s;background:#fbfbfa;
  margin-bottom:16px;
}
#drop-zone:hover,#drop-zone.drag-over{border-color:#2383e2;background:#f0f6ff}
#drop-zone .dz-icon{font-size:44px}
#drop-zone .dz-main{font-weight:600;font-size:15px;margin-top:10px}
#drop-zone .dz-sub{font-size:13px;color:#787774;margin-top:4px}
#ocr-result-box{
  border:1px solid #e9e9e7;border-radius:9px;padding:16px;
  min-height:100px;font-size:14px;line-height:1.85;
  white-space:pre-wrap;background:#fbfbfa;outline:none;
}

/* ── Checklist ── */
.progress-wrap{margin:14px 0 6px}
.progress-bar{height:6px;background:#e9e9e7;border-radius:3px}
.progress-fill{height:100%;background:#2383e2;border-radius:3px;transition:width .3s}
.check-item{
  display:flex;align-items:center;gap:10px;
  padding:11px 13px;border-radius:7px;margin-bottom:5px;
  border:1px solid #e9e9e7;cursor:pointer;font-size:14px;
  transition:background .15s;
}
.check-item:hover{background:#f5f5f4}
.check-item.done{opacity:.45;text-decoration:line-through;color:#9b9a97}
.check-item input[type=checkbox]{
  width:17px;height:17px;cursor:pointer;accent-color:#2383e2;flex-shrink:0;
}
.checklist-type-btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}

/* ── Search ── */
#search-box{
  width:100%;padding:11px 16px;font-size:15px;
  border:1px solid #e9e9e7;border-radius:9px;
  outline:none;margin-bottom:18px;
}
#search-box:focus{border-color:#2383e2}
.s-result{border:1px solid #e9e9e7;border-radius:8px;padding:13px 15px;margin-bottom:8px;cursor:pointer}
.s-result:hover{border-color:#2383e2;background:#f4f8ff}
.s-title{font-weight:600;font-size:14px}
.s-excerpt{font-size:13px;color:#787774;margin-top:3px}
.tag{display:inline-block;background:#f3f0ff;color:#6940a5;border-radius:4px;padding:2px 7px;font-size:11px;margin:1px}

/* ── Template fill area ── */
#tpl-two-col{display:flex;gap:20px}
#tpl-list-col{flex:0 0 220px}
#tpl-fill-col{flex:1;min-width:0}
.var-chip{background:#fffbe6;color:#946900;border-radius:4px;padding:2px 7px;font-size:12px;display:inline-block;margin:2px;border:1px solid #f0e6c0}
.preview-box{background:#fbfbfa;border:1px solid #e9e9e7;border-radius:8px;padding:16px;margin-top:12px;white-space:pre-wrap;font-size:14px;line-height:1.8}

/* ── Toast ── */
#toast{
  position:fixed;bottom:22px;right:22px;
  background:#37352f;color:#fff;padding:10px 18px;
  border-radius:9px;font-size:13px;z-index:9999;
  opacity:0;transition:opacity .2s;pointer-events:none;
}
#toast.show{opacity:1}

/* ── Divider ── */
.divider{height:1px;background:#e9e9e7;margin:16px 0}

/* ── Loading ── */
.loading{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#787774}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #d3d1cb;border-top-color:#2383e2;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Empty state ── */
.empty{text-align:center;padding:48px 20px;color:#9b9a97;font-size:14px}
.empty-icon{font-size:40px;margin-bottom:12px}

/* ── Responsive ── */
@media(max-width:640px){
  #memo-list-col{width:150px}
  #memo-editor-col{padding:20px 16px}
  .std-page{padding:20px 16px}
  #tpl-two-col{flex-direction:column}
  #tpl-list-col{flex:none;width:100%}
  .nav-btn{font-size:12px;padding:4px 8px}
}
</style>
</head>
<body>

<!-- ═══════════════ TOP BAR ═══════════════ -->
<div id="topbar">
  <span id="topbar-logo">📋 営業ナレッジ</span>
  <button class="nav-btn active" id="nav-memo"      onclick="showPage('memo')">📝 メモ</button>
  <button class="nav-btn"        id="nav-search"    onclick="showPage('search')">🔍 検索</button>
  <button class="nav-btn"        id="nav-ocr"       onclick="showPage('ocr')">📷 OCR</button>
  <button class="nav-btn"        id="nav-template"  onclick="showPage('template')">✉️ テンプレ</button>
  <button class="nav-btn"        id="nav-checklist" onclick="showPage('checklist')">✅ チェック</button>
  <div class="spacer"></div>
  <a id="db-link" href="#" target="_blank" title="データベースを開く">📊 DB</a>
</div>

<!-- ═══════════════ PAGES ═══════════════ -->
<div id="pages">

  <!-- ── MEMO ── -->
  <div class="page active" id="page-memo">
    <div id="memo-list-col">
      <div id="memo-list-header">
        <button class="btn btn-primary btn-full" onclick="newMemo()">＋ 新規メモ</button>
      </div>
      <div id="memo-list-scroll">
        <div class="empty" id="memo-list-empty" style="display:none">
          <div>まだメモがありません</div>
        </div>
        <div id="memo-list"></div>
      </div>
    </div>
    <div id="memo-editor-col">
      <div id="save-status"></div>
      <input id="memo-title-input"   type="text" placeholder="タイトル…"               oninput="autoSave()">
      <input id="memo-tags-input"    type="text" placeholder="タグ（カンマ区切り）…"    oninput="autoSave()">
      <div class="divider"></div>
      <textarea id="memo-content-input" placeholder="ここに内容を入力…&#10;&#10;機種の仕様、お客様メモ、手順など何でも" oninput="autoSave()"></textarea>
      <div class="editor-actions">
        <button class="btn btn-ghost btn-sm" onclick="deleteCurrent()">🗑 削除</button>
      </div>
    </div>
  </div>

  <!-- ── SEARCH ── -->
  <div class="page" id="page-search">
    <div class="std-page">
      <div class="page-heading">🔍 全文検索</div>
      <div class="page-sub">メモのタイトル・内容・タグを横断検索します</div>
      <input id="search-box" type="text" placeholder="キーワードを入力…" oninput="doSearch(this.value)">
      <div id="search-results"></div>
    </div>
  </div>

  <!-- ── OCR ── -->
  <div class="page" id="page-ocr">
    <div class="std-page">
      <div class="page-heading">📷 OCR・テキスト抽出</div>
      <div class="page-sub">画像・PDFをアップロードしてテキストを自動抽出します（Gemini AI使用）</div>

      <div id="drop-zone"
           onclick="document.getElementById('file-input').click()"
           ondragover="event.preventDefault();this.classList.add('drag-over')"
           ondragleave="this.classList.remove('drag-over')"
           ondrop="handleDrop(event)">
        <div class="dz-icon" id="dz-icon">📄</div>
        <div class="dz-main" id="dz-main">クリックまたはドロップでファイルを選択</div>
        <div class="dz-sub" id="dz-sub">対応: JPG・PNG・PDF（最大 10MB）</div>
      </div>
      <input type="file" id="file-input" accept="image/*,application/pdf" style="display:none" onchange="handleFileInput(this)">

      <div id="ocr-actions" style="display:none;margin-bottom:16px">
        <label>抽出の指示（任意）</label>
        <input type="text" id="ocr-prompt" placeholder="例: 金額と品番だけ抽出して  /  表を読み取って">
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn btn-primary" onclick="runOcr()">テキスト抽出</button>
          <button class="btn btn-secondary" onclick="resetOcr()">ファイルをリセット</button>
          <span id="ocr-loading" class="loading" style="display:none"><span class="spin"></span>処理中…</span>
        </div>
      </div>

      <div id="ocr-result-area" style="display:none">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <strong style="font-size:14px">抽出結果（クリックして編集可）</strong>
          <div style="display:flex;gap:6px">
            <button class="btn btn-secondary btn-sm" onclick="copyOcrText()">コピー</button>
            <button class="btn btn-primary btn-sm" onclick="saveOcrAsMemo()">メモに保存</button>
          </div>
        </div>
        <div id="ocr-result-box" contenteditable="true"></div>
      </div>
    </div>
  </div>

  <!-- ── TEMPLATE ── -->
  <div class="page" id="page-template">
    <div class="std-page" style="max-width:960px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <div class="page-heading">✉️ メールテンプレート</div>
        <button class="btn btn-primary btn-sm" onclick="openNewTpl()">＋ 新規</button>
      </div>
      <div class="page-sub">テンプレートを選択して変数を入力し、Gmailの下書きを一発作成します</div>
      <div id="tpl-two-col">
        <div id="tpl-list-col">
          <div class="section-title">テンプレート一覧</div>
          <div id="tpl-list"></div>
        </div>
        <div id="tpl-fill-col">
          <div id="tpl-fill-area">
            <div class="empty">
              <div class="empty-icon">👈</div>
              <div>左からテンプレートを選んでください</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── CHECKLIST ── -->
  <div class="page" id="page-checklist">
    <div class="std-page" style="max-width:600px">
      <div class="page-heading">✅ 送信前チェックリスト</div>
      <div class="page-sub">確認漏れによるミスを防ぎます</div>
      <div class="checklist-type-btns">
        <button class="btn btn-secondary" onclick="loadChecklist('email')">📧 メール送信前</button>
        <button class="btn btn-secondary" onclick="loadChecklist('estimate')">📊 見積書送付前</button>
        <button class="btn btn-secondary" onclick="loadChecklist('visit')">🚗 訪問前</button>
        <button class="btn btn-ghost btn-sm" onclick="resetChecklist()" style="margin-left:auto">リセット</button>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      </div>
      <div id="checklist-count" style="font-size:13px;color:#787774;margin-bottom:12px">種類を選択してください</div>
      <div id="checklist-items"></div>
    </div>
  </div>

</div><!-- /pages -->

<div id="toast"></div>

<!-- ═══════════════ JAVASCRIPT ═══════════════ -->
<script>
// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let memos = [];
let currentMemoId = null;
let saveTimer = null;
let templates = [];
let selectedTplId = null;
let checkItems = [];
let ocrBase64 = null;
let ocrMime = null;

// ─────────────────────────────────────────────
// NAVIGATION
// ─────────────────────────────────────────────
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.getElementById('nav-' + name).classList.add('active');

  if (name === 'memo')     loadMemos();
  if (name === 'template') loadTemplates();
}

// ─────────────────────────────────────────────
// TOAST
// ─────────────────────────────────────────────
let toastTimer;
function toast(msg, dur = 2200) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), dur);
}

// ─────────────────────────────────────────────
// MEMO
// ─────────────────────────────────────────────
function loadMemos(query) {
  google.script.run
    .withSuccessHandler(data => { memos = data; renderMemoList(); })
    .getMemos(query || null);
}

function renderMemoList() {
  const listEl = document.getElementById('memo-list');
  const emptyEl = document.getElementById('memo-list-empty');
  if (!memos.length) {
    listEl.innerHTML = '';
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';
  listEl.innerHTML = memos.map(m => `
    <div class="memo-item ${m.id === currentMemoId ? 'active' : ''}"
         onclick="openMemo('${m.id}')">
      <div class="mi-title">${esc(m.title || '無題')}</div>
      <div class="mi-date">${m.updated || ''}</div>
    </div>
  `).join('');
}

function newMemo() {
  currentMemoId = null;
  document.getElementById('memo-title-input').value = '';
  document.getElementById('memo-tags-input').value = '';
  document.getElementById('memo-content-input').value = '';
  document.getElementById('save-status').textContent = '新規メモ';
  renderMemoList();
  document.getElementById('memo-title-input').focus();
}

function openMemo(id) {
  const m = memos.find(x => x.id === id);
  if (!m) return;
  currentMemoId = id;
  document.getElementById('memo-title-input').value = m.title || '';
  document.getElementById('memo-tags-input').value = m.tags || '';
  document.getElementById('memo-content-input').value = m.content || '';
  document.getElementById('save-status').textContent = '更新: ' + (m.updated || m.created || '');
  renderMemoList();
}

function autoSave() {
  document.getElementById('save-status').textContent = '入力中…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 1400);
}

function doSave() {
  const memo = {
    id: currentMemoId,
    title:   document.getElementById('memo-title-input').value || '無題',
    content: document.getElementById('memo-content-input').value,
    tags:    document.getElementById('memo-tags-input').value,
  };
  google.script.run
    .withSuccessHandler(res => {
      if (!res.ok) return;
      currentMemoId = res.id;
      document.getElementById('save-status').textContent = '保存済み ✓';
      loadMemos();
    })
    .saveMemo(memo);
}

function deleteCurrent() {
  if (!currentMemoId) return;
  if (!confirm('このメモを削除しますか？')) return;
  google.script.run
    .withSuccessHandler(() => {
      currentMemoId = null;
      ['memo-title-input','memo-tags-input','memo-content-input']
        .forEach(id => document.getElementById(id).value = '');
      document.getElementById('save-status').textContent = '削除しました';
      loadMemos();
    })
    .deleteMemo(currentMemoId);
}

// ─────────────────────────────────────────────
// SEARCH
// ─────────────────────────────────────────────
let searchTimer;
function doSearch(q) {
  clearTimeout(searchTimer);
  const el = document.getElementById('search-results');
  if (!q.trim()) { el.innerHTML = ''; return; }
  searchTimer = setTimeout(() => {
    google.script.run
      .withSuccessHandler(data => {
        if (!data.length) {
          el.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div><div>見つかりませんでした</div></div>';
          return;
        }
        el.innerHTML = data.map(m => {
          const excerpt = (m.content || '').slice(0, 90) + ((m.content || '').length > 90 ? '…' : '');
          const tags = (m.tags || '').split(',').filter(t => t.trim()).map(t => `<span class="tag">${esc(t.trim())}</span>`).join('');
          return `<div class="s-result" onclick="goToMemo('${m.id}')">
            <div class="s-title">${esc(m.title || '無題')}</div>
            <div class="s-excerpt">${esc(excerpt)}</div>
            ${tags ? `<div style="margin-top:5px">${tags}</div>` : ''}
          </div>`;
        }).join('');
      })
      .getMemos(q);
  }, 280);
}

function goToMemo(id) {
  showPage('memo');
  setTimeout(() => {
    const m = memos.find(x => x.id === id);
    if (m) openMemo(id);
    else {
      loadMemos();
      setTimeout(() => openMemo(id), 600);
    }
  }, 100);
}

// ─────────────────────────────────────────────
// OCR
// ─────────────────────────────────────────────
function handleDrop(e) {
  e.preventDefault();
  document.getElementById('drop-zone').classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) loadOcrFile(file);
}

function handleFileInput(input) {
  const file = input.files[0];
  if (file) loadOcrFile(file);
  input.value = '';
}

function loadOcrFile(file) {
  if (file.size > 10 * 1024 * 1024) { toast('10MB以下のファイルを選択してください'); return; }
  const reader = new FileReader();
  reader.onload = e => {
    ocrBase64 = e.target.result.split(',')[1];
    ocrMime = file.type || 'application/octet-stream';
    document.getElementById('dz-icon').textContent = file.type.includes('pdf') ? '📑' : '🖼';
    document.getElementById('dz-main').textContent = file.name;
    document.getElementById('dz-sub').textContent = (file.size / 1024).toFixed(0) + ' KB — クリックで変更';
    document.getElementById('ocr-actions').style.display = 'block';
    document.getElementById('ocr-result-area').style.display = 'none';
  };
  reader.readAsDataURL(file);
}

function resetOcr() {
  ocrBase64 = null; ocrMime = null;
  document.getElementById('dz-icon').textContent = '📄';
  document.getElementById('dz-main').textContent = 'クリックまたはドロップでファイルを選択';
  document.getElementById('dz-sub').textContent = '対応: JPG・PNG・PDF（最大 10MB）';
  document.getElementById('ocr-actions').style.display = 'none';
  document.getElementById('ocr-result-area').style.display = 'none';
}

function runOcr() {
  if (!ocrBase64) { toast('ファイルを選択してください'); return; }
  const prompt = document.getElementById('ocr-prompt').value;
  document.getElementById('ocr-loading').style.display = 'inline-flex';
  google.script.run
    .withSuccessHandler(res => {
      document.getElementById('ocr-loading').style.display = 'none';
      if (res.error) { toast('エラー: ' + res.error, 5000); return; }
      document.getElementById('ocr-result-box').textContent = res.text;
      document.getElementById('ocr-result-area').style.display = 'block';
    })
    .withFailureHandler(() => {
      document.getElementById('ocr-loading').style.display = 'none';
      toast('エラーが発生しました。APIキーを確認してください。', 5000);
    })
    .processFile(ocrBase64, ocrMime, prompt || null);
}

function copyOcrText() {
  const text = document.getElementById('ocr-result-box').textContent;
  navigator.clipboard.writeText(text).then(() => toast('クリップボードにコピーしました'));
}

function saveOcrAsMemo() {
  const text = document.getElementById('ocr-result-box').textContent;
  const today = new Date().toLocaleDateString('ja-JP');
  google.script.run
    .withSuccessHandler(res => {
      if (res.ok) { toast('メモに保存しました'); showPage('memo'); }
    })
    .saveMemo({ title: 'OCR ' + today, content: text, tags: 'OCR' });
}

// ─────────────────────────────────────────────
// TEMPLATES
// ─────────────────────────────────────────────
function loadTemplates() {
  google.script.run
    .withSuccessHandler(data => { templates = data; renderTplList(); })
    .getTemplates();
}

function renderTplList() {
  document.getElementById('tpl-list').innerHTML = templates.map(t => `
    <div class="card ${t.id === selectedTplId ? 'selected' : ''}" onclick="selectTpl('${t.id}')">
      <div class="card-title">${esc(t.name)}</div>
      <div class="card-sub">${esc(t.subject.slice(0, 36))}${t.subject.length > 36 ? '…' : ''}</div>
    </div>
  `).join('') + `
    <div class="card" onclick="openNewTpl()" style="border-style:dashed;text-align:center;color:#9b9a97">
      ＋ 新規テンプレート
    </div>
  `;
}

function extractVars(tpl) {
  const all = ((tpl.subject || '') + ' ' + (tpl.body || '')).match(/\{[^}]+\}/g) || [];
  return [...new Set(all)];
}

function selectTpl(id) {
  selectedTplId = id;
  renderTplList();
  const tpl = templates.find(t => t.id === id);
  if (!tpl) return;
  const vars = extractVars(tpl);
  const fillEl = document.getElementById('tpl-fill-area');
  fillEl.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <strong style="font-size:16px">${esc(tpl.name)}</strong>
      <button class="btn btn-danger btn-sm" onclick="deleteTpl('${id}')">削除</button>
    </div>
    ${vars.length ? `
      <div class="section-title">変数を入力</div>
      <div style="margin-bottom:6px">${vars.map(v => `<span class="var-chip">${esc(v)}</span>`).join('')}</div>
      ${vars.map(v => `
        <label>${esc(v)}</label>
        <input type="text" id="var_${v.replace(/[{}]/g,'')}" placeholder="${esc(v)}">
      `).join('')}
    ` : '<div class="section-title">変数なし</div>'}
    <label>送信先メール（任意）</label>
    <input type="email" id="tpl-to" placeholder="example@company.com">
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
      <button class="btn btn-secondary" onclick="previewTpl('${id}')">プレビュー</button>
      <button class="btn btn-primary"   onclick="createDraft('${id}')">✉️ Gmail 下書きを作成</button>
    </div>
    <div id="tpl-preview" style="display:none;margin-top:14px"></div>
  `;
}

function getVarMap(tpl) {
  const vars = extractVars(tpl);
  const map = {};
  vars.forEach(v => {
    const key = v.replace(/[{}]/g, '');
    const el = document.getElementById('var_' + key);
    map[v] = el ? el.value : v;
  });
  return map;
}

function applyVars(str, map) {
  let r = str;
  for (const [k, v] of Object.entries(map)) r = r.split(k).join(v || k);
  // Replace {日付} with today automatically
  r = r.replace(/\{日付\}/g, new Date().toLocaleDateString('ja-JP'));
  return r;
}

function previewTpl(id) {
  const tpl = templates.find(t => t.id === id);
  if (!tpl) return;
  const map = getVarMap(tpl);
  const subj = applyVars(tpl.subject, map);
  const body = applyVars(tpl.body, map);
  const el = document.getElementById('tpl-preview');
  el.style.display = 'block';
  el.innerHTML = `
    <div class="section-title">プレビュー</div>
    <div class="preview-box">
      <div style="font-size:12px;color:#787774;margin-bottom:4px">件名</div>
      <div style="font-weight:600;font-size:14px;margin-bottom:12px">${esc(subj)}</div>
      <div style="font-size:12px;color:#787774;margin-bottom:4px">本文</div>
      <div style="font-size:14px;line-height:1.85">${esc(body)}</div>
    </div>
  `;
}

function createDraft(id) {
  const tpl = templates.find(t => t.id === id);
  if (!tpl) return;
  const map = getVarMap(tpl);
  const subj = applyVars(tpl.subject, map);
  const body = applyVars(tpl.body, map);
  const to   = (document.getElementById('tpl-to') || {}).value || '';
  google.script.run
    .withSuccessHandler(() => toast('Gmailに下書きを作成しました ✓'))
    .createGmailDraft(to, subj, body);
}

function openNewTpl() {
  selectedTplId = null;
  renderTplList();
  document.getElementById('tpl-fill-area').innerHTML = `
    <strong style="font-size:16px">新規テンプレート</strong>
    <label>テンプレート名</label>
    <input type="text" id="new-name" placeholder="見積書送付">
    <label>件名（変数は {顧客名} のように記述）</label>
    <input type="text" id="new-subj" placeholder="【見積書】{顧客名}様_{商品名}">
    <label>本文</label>
    <textarea id="new-body" rows="7" placeholder="{顧客名} 様\n\nいつもお世話になっております。{自分の名前}です。\n…"></textarea>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn btn-primary" onclick="saveTpl()">保存</button>
      <button class="btn btn-secondary" onclick="loadTemplates()">キャンセル</button>
    </div>
  `;
}

function saveTpl() {
  const tpl = {
    name:    (document.getElementById('new-name') || {}).value || 'テンプレート',
    subject: (document.getElementById('new-subj') || {}).value || '',
    body:    (document.getElementById('new-body') || {}).value || '',
  };
  google.script.run
    .withSuccessHandler(() => { toast('保存しました'); loadTemplates(); })
    .saveTemplate(tpl);
}

function deleteTpl(id) {
  if (!confirm('このテンプレートを削除しますか？')) return;
  google.script.run
    .withSuccessHandler(() => {
      toast('削除しました');
      selectedTplId = null;
      loadTemplates();
      document.getElementById('tpl-fill-area').innerHTML = '<div class="empty"><div class="empty-icon">👈</div><div>テンプレートを選んでください</div></div>';
    })
    .deleteTemplate(id);
}

// ─────────────────────────────────────────────
// CHECKLIST
// ─────────────────────────────────────────────
function loadChecklist(type) {
  google.script.run
    .withSuccessHandler(items => {
      checkItems = items.map((text, i) => ({ id: i, text, done: false }));
      renderChecklist();
    })
    .getChecklist(type);
}

function renderChecklist() {
  const el = document.getElementById('checklist-items');
  el.innerHTML = checkItems.map(item => `
    <div class="check-item ${item.done ? 'done' : ''}" onclick="toggleCheck(${item.id})">
      <input type="checkbox" ${item.done ? 'checked' : ''} onclick="event.stopPropagation();toggleCheck(${item.id})">
      <span>${esc(item.text)}</span>
    </div>
  `).join('');
  updateProgress();
}

function toggleCheck(id) {
  const item = checkItems.find(x => x.id === id);
  if (!item) return;
  item.done = !item.done;
  renderChecklist();
}

function updateProgress() {
  const done  = checkItems.filter(x => x.done).length;
  const total = checkItems.length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('checklist-count').textContent =
    total ? `${done} / ${total} 完了 (${pct}%)` : '種類を選択してください';
  if (total && done === total) setTimeout(() => toast('全項目チェック完了！送信できます ✓'), 200);
}

function resetChecklist() {
  checkItems.forEach(x => x.done = false);
  renderChecklist();
}

// ─────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────
function esc(str) {
  return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
loadMemos();
google.script.run.withSuccessHandler(url => {
  if (url) document.getElementById('db-link').href = url;
}).getDbUrl();
</script>
